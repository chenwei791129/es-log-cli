name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Serialize release runs so rapid pushes to main cannot spawn overlapping
# release-please runs or racing asset uploads against the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Shared workflow: the pinned release-please SHA is maintained in
  # chenwei791129/.github for every repository.
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: chenwei791129/.github/.github/workflows/release-please.yml@main
    with:
      release-type: go

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # Delegate to `make build` so release binaries match the canonical
        # build contract (CGO_ENABLED=0, -trimpath, ldflags). The tag_name is
        # passed explicitly because the shallow checkout has no tags for
        # `git describe` to resolve.
        run: |
          make build \
            BINARY=es-log-${{ matrix.goos }}-${{ matrix.goarch }} \
            VERSION=${{ needs.release-please.outputs.tag_name }}
      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "es-log-${{ matrix.goos }}-${{ matrix.goarch }}" --clobber
